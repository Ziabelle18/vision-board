<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Board - This Is Me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f2ede4;
            --accent-gold: #c5a059;
            --accent-black: #1a1a1a;
            --font-main: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-main);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px 100px 15px; /* Extra bottom padding para sa floating music player */
            /* Subtle dotted background pattern */
            background-image: radial-gradient(rgba(0,0,0,0.06) 0.8px, transparent 0.8px);
            background-size: 20px 20px;
        }

        /* Poster Display Frame */
        .board-wrapper {
            position: relative;
            max-width: 900px;
            width: 100%;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            overflow: hidden;
            border: 1px solid #e0d8c8;
        }

        /* The Main AI Poster Image */
        .board-img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none; /* Iniiwasan ang accidental dragging ng pic */
        }

        /* Interactive Clickable Overlay Hotspots (Halimbawa para sa interactive links/popups) */
        .hotspot {
            position: absolute;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(197, 160, 89, 0);
        }

        .hotspot:hover {
            background: rgba(197, 160, 89, 0.15);
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.4);
            border: 1.5px dashed var(--accent-gold);
        }

        /* Positions ng Interactive Zones (In % para responsive sa mobile/desktop) */
        .spot-things-i-love {
            top: 47%;
            left: 2%;
            width: 30%;
            height: 25%;
        }

        .spot-future-goals {
            top: 3%;
            right: 2%;
            width: 25%;
            height: 16%;
        }

        .spot-philosophy {
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 25%;
            height: 10%;
        }

        /* Floating Audio Player Bar */
        .floating-player {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 26, 0.92);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 18px;
            z-index: 100;
            border: 1px solid rgba(197, 160, 89, 0.4);
        }

        .player-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .player-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
        }

        .player-subtitle {
            font-size: 0.75rem;
            color: var(--accent-gold);
        }

        .play-btn {
            background: var(--accent-gold);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.08);
            background: #d4ae63;
        }
    </style>
</head>
<body>

    <!-- Main Vision Board Frame -->
    <div class="board-wrapper">
        <!-- Siguraduhing "vision-board.png" ang name ng AI photo mo sa folder -->
        <img src="vision-board.png" alt="Vision Board Poster" class="board-img">

        <!-- Clickable Overlay Zones -->
        <div class="hotspot spot-things-i-love" onclick="showAlert('🎤 Things I Love', 'Performing, Music, Horror Movies & Creative Outlets!')" title="Click to view details"></div>
        <div class="hotspot spot-future-goals" onclick="showAlert('📌 Future Goals', 'Financial Freedom, Luxury Travel & Building My Business!')" title="Click to view details"></div>
        <div class="hotspot spot-philosophy" onclick="showAlert('✨ My Philosophy', 'Stay kind, work hard, be humble, trust God.')" title="Click to view details"></div>
    </div>

    <!-- Floating Soundtrack Player -->
    <div class="floating-player">
        <div class="player-info">
            <span class="player-title">🎵 Vision Board Soundtrack</span>
            <span class="player-subtitle">Live Covers & Vocal Vibes</span>
        </div>

        <!-- Palitan ng totoong audio file path kung may song.mp3 ka -->
        <audio id="bgMusic" src="song.mp3" loop></audio>

        <button class="play-btn" onclick="togglePlay()" id="playBtn">▶️</button>
    </div>

    <script>
        // Toggle Audio Play/Pause
        function togglePlay() {
            var audio = document.getElementById("bgMusic");
            var btn = document.getElementById("playBtn");
            
            if (audio.paused) {
                audio.play().then(() => {
                    btn.innerHTML = "⏸️";
                }).catch(e => {
                    alert("Maglagay ng 'song.mp3' file sa parehong folder para sa music!");
                });
            } else {
                audio.pause();
                btn.innerHTML = "▶️";
            }
        }

        // Custom Click Notification para sa Hotspots
        function showAlert(title, text) {
            alert(title + "\n\n" + text);
        }
    </script>

</body>
</html>
